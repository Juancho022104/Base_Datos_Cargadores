<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Segoe UI,Arial,sans-serif;
background:#f3f6f8;
color:#1f2937;
}

.container{
width:95%;
max-width:1200px;
margin:30px auto;
background:white;
border-radius:15px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h1{
color:#1E3530;
font-size:32px;
margin-bottom:5px;
}

h2{
color:#1E3530;
margin-bottom:20px;
}

h3{
color:#64748b;
font-weight:normal;
margin-bottom:25px;
}

.tabs{
display:flex;
gap:15px;
margin-bottom:25px;
}

button{
border:none;
padding:13px 22px;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:bold;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

button:disabled{
opacity:.6;
cursor:not-allowed;
transform:none;
}

.btn-entrada{
background:#22c55e;
color:white;
}

.btn-salida{
background:#ef4444;
color:white;
}

.card{
background:#fafafa;
border:1px solid #dbe4ea;
border-radius:12px;
padding:25px;
}

.oculto{
display:none;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.form-group{
display:flex;
flex-direction:column;
}

.form-group.full{
grid-column:1/3;
}

label{
font-weight:bold;
margin-bottom:6px;
color:#334155;
}

input,select,textarea{
width:100%;
padding:11px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:14px;
background:white;
}

textarea{
height:90px;
resize:none;
}

input:focus,select:focus,textarea:focus{
outline:none;
border-color:#1E3530;
box-shadow:0 0 0 3px rgba(30,53,48,.15);
}

.btn-guardar{
margin-top:20px;
background:#1E3530;
color:white;
}

.btn-guardar:hover{
background:#274841;
}

.foto-box{
border:2px dashed #cbd5e1;
padding:15px;
border-radius:10px;
background:white;
}

.canvas-box{
border:1px solid #cbd5e1;
border-radius:10px;
padding:10px;
background:white;
}

canvas{
width:100%;
height:130px;
border:1px dashed #94a3b8;
background:#fafafa;
border-radius:8px;
}

@media(max-width:850px){

.form-grid{
grid-template-columns:1fr;
}

.form-group.full{
grid-column:auto;
}

.tabs{
flex-direction:column;
}

button{
width:100%;
}

.container{
width:95%;
padding:20px;
}

}
</style>
