<script>

window.onload = function () {
  mostrarEntrada();
};

//================================================
// FORMULARIO ENTRADA
//================================================

function mostrarEntrada() {
  document.getElementById("contenido").innerHTML = `

<div class="card">

<h2>🟢 Registro de Entrada</h2>

<div class="form-grid">

<div class="form-group">

<div class="form-group">

<div class="form-group">

<div class="form-group">

</div>

<div class="form-group">

<div class="form-group">

<input id="lecturaInicial" type="number" min="0" step="0.01">

<input id="fotoInicial" type="file" accept="image/*" capture="environment">

<input id="vigilante">
</div>

<div class="form-group full">
<label>Observaciones</label>
<textarea id="observaciones"></textarea>
</div>

</div>

<h3>Firmas de Autorización</h3>

<div class="form-grid">

<div class="canvas-box">
<label>Firma Vigilante</label>
<canvas id="firmaVigilante"></canvas>
<button type="button" onclick="limpiarFirma('vigilante')">🗑️ Borrar Firma Vigilante</button>
</div>

<div class="canvas-box">
<label>Firma Residente</label>
<canvas id="firmaResidente"></canvas>
<button type="button" onclick="limpiarFirma('residente')">🗑️ Borrar Firma Residente</button>
</div>

<button class="btn-guardar" id="btnGuardarEntrada" onclick="guardarEntrada()">💾 Guardar Entrada</button>

//================================================
// FORMULARIO SALIDA
//================================================

function mostrarSalida() {
  document.getElementById("contenido").innerHTML = `

<div class="card">

<h2>🔴 Registro de Salida</h2>

<div class="form-group">
<label>Vehículo en Carga</label>
<select id="selectVehiculos">
<option value="">Cargando vehículos...</option>
</select>
</div>

<div class="form-group">
<label>Hora Salida</label>
<input type="time" id="horaSalida">
</div>

<div class="form-group">
<label>Lectura Final kWh</label>
<input type="number" id="lecturaFinal" min="0" step="0.01">
</div>

<div class="form-group">
<label>Foto Lectura Final</label>
<input id="fotoFinal" type="file" accept="image/*" capture="environment">
</div>

<button class="btn-guardar" id="btnRegistrarSalida" onclick="registrarSalida()">🔌 Registrar Salida</button>

</div>

`;

  cargarVehiculos();
  colocarHoraSalida();
}

//================================================
// FECHA Y HORA AUTOMÁTICA
//================================================

function colocarFechaHora() {
  let fecha = new Date();

  document.getElementById("fecha").value = fecha.toISOString().substring(0, 10);

  let hora =
    String(fecha.getHours()).padStart(2, "0") + ":" +
    String(fecha.getMinutes()).padStart(2, "0");

  document.getElementById("horaEntrada").value = hora;
}

function colocarHoraSalida() {
  let fecha = new Date();

  let hora =
    String(fecha.getHours()).padStart(2, "0") + ":" +
    String(fecha.getMinutes()).padStart(2, "0");

  document.getElementById("horaSalida").value = hora;
}

//================================================
// CARGAR VEHÍCULOS ACTIVOS
//================================================

function cargarVehiculos() {
  google.script.run
    .withSuccessHandler(function (lista) {
      let select = document.getElementById("selectVehiculos");
      let boton = document.getElementById("btnRegistrarSalida");

      if (!select) {
        return;
      }

      select.innerHTML = "";

      if (lista.length === 0) {
        select.innerHTML = "<option value=''>No hay vehículos en carga</option>";
        if (boton) {
          boton.disabled = true;
        }
        return;
      }

      if (boton) {
        boton.disabled = false;
      }

      lista.forEach(function (v) {
        let option = document.createElement("option");

        option.value = v.fila;
        option.text = "Apto " + v.apto + " - " + v.placa + " - " + v.nombre;

        select.appendChild(option);
      });
    })
    .withFailureHandler(function (error) {
      alert("Error cargando vehículos: " + error.message);
    })
    .obtenerVehiculosEnCarga();
}

//================================================
// VALIDACIÓN DE CORREO (cliente)
//================================================

function correoValido(correo) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);
}

//================================================
// GUARDAR REGISTRO ENTRADA
//================================================

function guardarEntrada() {
  let datosBase = {
    fecha: document.getElementById("fecha").value,
    horaEntrada: document.getElementById("horaEntrada").value,
    puntoCarga: document.getElementById("puntoCarga").value,
    bloque: document.getElementById("bloque").value,
    apto: document.getElementById("apto").value.trim().toUpperCase(),
    placa: document.getElementById("placa").value.trim().toUpperCase(),
    nombre: document.getElementById("nombre").value.trim(),
    cedula: document.getElementById("cedula").value.trim(),
    correoResidente: document.getElementById("correoResidente").value.trim(),
    lecturaInicial: document.getElementById("lecturaInicial").value,
    vigilante: document.getElementById("vigilante").value.trim(),
    observaciones: document.getElementById("observaciones").value.trim()
  };

  // VALIDACIONES

  if (datosBase.apto === "") {
    alert("Ingrese apartamento");
    return;
  }

  if (datosBase.placa === "") {
    alert("Ingrese placa");
    return;
  }

  if (datosBase.nombre === "") {
    alert("Ingrese nombre residente");
    return;
  }

  if (datosBase.cedula === "") {
    alert("Ingrese cédula del residente");
    return;
  }

  if (datosBase.vigilante === "") {
    alert("Ingrese nombre del vigilante");
    return;
  }

  if (datosBase.correoResidente === "" || !correoValido(datosBase.correoResidente)) {
    alert("Ingrese un correo válido para el residente");
    return;
  }

  if (datosBase.lecturaInicial === "" || isNaN(Number(datosBase.lecturaInicial)) || Number(datosBase.lecturaInicial) < 0) {
    alert("Ingrese una lectura inicial válida");
    return;
  }

  if (!firmaVigilanteTrazada) {
    alert("Falta la firma del vigilante");
    return;
  }

  if (!firmaResidenteTrazada) {
    alert("Falta la firma del residente");
    return;
  }

  let boton = document.getElementById("btnGuardarEntrada");
  boton.disabled = true;
  boton.textContent = "Guardando...";

  convertirFotoBase64(document.getElementById("fotoInicial"))
    .then(function (foto) {
      let firmas = obtenerFirmas();

      datosBase.fotoInicial = foto;
      datosBase.firmaVigilante = firmas.firmaVigilante;
      datosBase.firmaResidente = firmas.firmaResidente;

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            alert("✅ Entrada registrada correctamente");
            mostrarSalida();
          } else {
            boton.disabled = false;
            boton.textContent = "💾 Guardar Entrada";
            alert(res.mensaje);
          }
        })
        .withFailureHandler(function (error) {
          boton.disabled = false;
          boton.textContent = "💾 Guardar Entrada";
          alert("Error guardando entrada: " + error.message);
        })
        .guardarEntrada(datosBase);
    });
}

//================================================
// REGISTRAR SALIDA
//================================================

function registrarSalida() {
  let fila = document.getElementById("selectVehiculos").value;
  let lecturaFinal = document.getElementById("lecturaFinal").value;
  let horaSalida = document.getElementById("horaSalida").value;

  if (!fila) {
    alert("Seleccione un vehículo");
    return;
  }

  if (lecturaFinal === "" || isNaN(Number(lecturaFinal)) || Number(lecturaFinal) < 0) {
    alert("Ingrese una lectura final válida");
    return;
  }

  let boton = document.getElementById("btnRegistrarSalida");
  boton.disabled = true;
  boton.textContent = "Guardando...";

  convertirFotoBase64(document.getElementById("fotoFinal"))
    .then(function (foto) {
      let datos = {
        fila: Number(fila),
        lecturaFinal: Number(lecturaFinal),
        horaSalida: horaSalida,
        fotoFinal: foto
      };

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            alert("✅ Salida registrada correctamente\n\nConsumo: " + res.consumo + " kWh");
            mostrarEntrada();
          } else {
            boton.disabled = false;
            boton.textContent = "🔌 Registrar Salida";
            alert(res.mensaje);
          }
        })
        .withFailureHandler(function (error) {
          boton.disabled = false;
          boton.textContent = "🔌 Registrar Salida";
          alert("Error registrando salida: " + error.message);
        })
        .registrarSalida(datos);
    });
}

//================================================
// FIRMAS DIGITALES CANVAS
//================================================

let canvasVigilante;
let canvasResidente;
let ctxVigilante;
let ctxResidente;
let firmaVigilanteTrazada = false;
let firmaResidenteTrazada = false;

//================================================
// INICIAR FIRMAS
//================================================

function iniciarFirmas() {
  canvasVigilante = document.getElementById("firmaVigilante");
  canvasResidente = document.getElementById("firmaResidente");

  if (!canvasVigilante || !canvasResidente) {
    return;
  }

  firmaVigilanteTrazada = false;
  firmaResidenteTrazada = false;

  ajustarCanvas(canvasVigilante);
  ajustarCanvas(canvasResidente);

  ctxVigilante = canvasVigilante.getContext("2d");
  ctxResidente = canvasResidente.getContext("2d");

  ctxVigilante.strokeStyle = "#000";
  ctxResidente.strokeStyle = "#000";

  activarFirma(canvasVigilante, ctxVigilante, function () {
    firmaVigilanteTrazada = true;
  });

  activarFirma(canvasResidente, ctxResidente, function () {
    firmaResidenteTrazada = true;
  });
}

//================================================
// AJUSTAR TAMAÑO CANVAS
//================================================

function ajustarCanvas(canvas) {
  let ancho = canvas.parentElement.offsetWidth;

  canvas.width = ancho;
  canvas.height = 130;
}

//================================================
// ACTIVAR FIRMA
//================================================

function activarFirma(canvas, ctx, alIniciarTrazo) {
  let dibujando = false;

  function posicion(e) {
    let rect = canvas.getBoundingClientRect();

    if (e.touches) {
      return {
        x: e.touches[0].clientX - rect.left,
        y: e.touches[0].clientY - rect.top
      };
    }

    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function iniciar(e) {
    e.preventDefault();
    dibujando = true;

    if (alIniciarTrazo) {
      alIniciarTrazo();
    }

    let pos = posicion(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function dibujar(e) {
    if (!dibujando) {
      return;
    }

    e.preventDefault();

    let pos = posicion(e);

    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function terminar() {
    dibujando = false;
  }

  canvas.addEventListener("mousedown", iniciar);
  canvas.addEventListener("mousemove", dibujar);
  canvas.addEventListener("mouseup", terminar);
  canvas.addEventListener("mouseleave", terminar);

  canvas.addEventListener("touchstart", iniciar, { passive: false });
  canvas.addEventListener("touchmove", dibujar, { passive: false });
  canvas.addEventListener("touchend", terminar);
}

//================================================
// BORRAR FIRMA
//================================================

function limpiarFirma(tipo) {
  if (tipo === "vigilante" && ctxVigilante) {
    ctxVigilante.clearRect(0, 0, canvasVigilante.width, canvasVigilante.height);
    firmaVigilanteTrazada = false;
  }

  if (tipo === "residente" && ctxResidente) {
    ctxResidente.clearRect(0, 0, canvasResidente.width, canvasResidente.height);
    firmaResidenteTrazada = false;
  }
}

//================================================
// OBTENER FIRMAS BASE64
//================================================

function obtenerFirmas() {
  return {
    firmaVigilante: firmaVigilanteTrazada && canvasVigilante ? canvasVigilante.toDataURL("image/png") : "",
    firmaResidente: firmaResidenteTrazada && canvasResidente ? canvasResidente.toDataURL("image/png") : ""
  };
}

//================================================
// COMPRIMIR Y CONVERTIR FOTO A BASE64
//================================================

function comprimirImagen(archivo, anchoMaximo, calidad) {
  return new Promise(function (resolve, reject) {
    let lector = new FileReader();

    lector.onload = function (e) {
      let img = new Image();

      img.onload = function () {
        let ancho = img.width;
        let alto = img.height;

        if (ancho > anchoMaximo) {
          alto = Math.round(alto * (anchoMaximo / ancho));
          ancho = anchoMaximo;
        }

        let canvas = document.createElement("canvas");
        canvas.width = ancho;
        canvas.height = alto;

        canvas.getContext("2d").drawImage(img, 0, 0, ancho, alto);

        resolve(canvas.toDataURL("image/jpeg", calidad));
      };

      img.onerror = function () {
        reject(new Error("No se pudo procesar la imagen."));
      };

      img.src = e.target.result;
    };

    lector.onerror = function () {
      reject(new Error("No se pudo leer el archivo."));
    };

    lector.readAsDataURL(archivo);
  });
}

function convertirFotoBase64(input) {
  return new Promise(function (resolve) {
    if (!input || !input.files || input.files.length === 0) {
      resolve("");
      return;
    }

    comprimirImagen(input.files[0], 1280, 0.7)
      .then(resolve)
      .catch(function () {
        resolve("");
      });
  });
}

//================================================
// FIN JS
//================================================

</script>
